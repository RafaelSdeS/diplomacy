<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#071d41" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<script>
			// O tema escolhido no perfil (passo 38), antes da primeira pintura.
			try {
				var tema = localStorage.getItem('tema');
				if (tema === 'light' || tema === 'dark') document.documentElement.dataset.theme = tema;
				// Passo 51: o tamanho do texto e a densidade escolhidos no perfil.
				var texto = localStorage.getItem('texto');
				if (texto === 'grande' || texto === 'maior') document.documentElement.dataset.texto = texto;
				var densidade = localStorage.getItem('densidade');
				if (densidade === 'confortavel' || densidade === 'compacta') document.documentElement.dataset.densidade = densidade;
				// Passo 66: o menu lateral recolhido.
				if (localStorage.getItem('menu') === 'recolhido') document.documentElement.dataset.menu = 'recolhido';
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
